name: CI

on:
  push:
  pull_request:

jobs:
  # M1: Repository hygiene — keep this required job.
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run hygiene checks
        run: bash scripts/hygiene.sh

  # M3: Build and test the React/Vite project.
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: react-frontend/package-lock.json
      - name: Install dependencies
        run: make install
      - name: Run tests
        run: make test
      - name: Build frontend
        run: make build


  # ---------------------------------------------------------------------------
  # M5 — Containerization.
  # ---------------------------------------------------------------------------

  docker:
    name: Build and push images
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Normalize image repository name
        id: image-name
        shell: bash
        run: echo "repository=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ghcr.io/${{ steps.image-name.outputs.repository }}-frontend:${{ github.sha }}
      
name: CI

on:
  push:
  pull_request:

jobs:
  # M1: Repository hygiene — keep this required job.
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run hygiene checks
        run: bash scripts/hygiene.sh

  # M3: Build and test the React/Vite project.
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: react-frontend/package-lock.json
      - name: Install dependencies
        run: make install
      - name: Run tests
        run: make test
      - name: Build frontend
        run: make build

  # M4/M5: Publish only trusted pushes to main; never publish from pull requests.
  docker:
    name: Build and push DevVault frontend image
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase repository name
        id: repo_name
        run: echo "repo=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.repo_name.outputs.repo }}-frontend:latest
            ghcr.io/${{ steps.repo_name.outputs.repo }}-frontend:${{ github.sha }}

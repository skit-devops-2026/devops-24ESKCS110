apiVersion: apps/v1
kind: Deployment
metadata:
  name: devvault-frontend
  labels:
    app: devvault-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devvault-frontend
  template:
    metadata:
      labels:
        app: devvault-frontend
    spec:
      containers:
        - name: devvault-frontend
          image: ghcr.io/skit-devops-2026/devvault-frontend:1.0.0
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
